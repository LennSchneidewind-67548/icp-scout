# The demo runs on the author's laptop during a screen share, offline (WP5).
[server]
# Only this machine: the case data never reaches the network.
address = "localhost"
headless = true
# Serves app/static/: the bundled fonts, so the demo needs no font CDN.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu on the screen share.
toolbarMode = "minimal"

# The deck's token sheet, so the demo and the slides look like one talk: warm
# off-white, ink, zinc greys, one orange accent used sparingly, Geist. Colour is kept
# for data: the tiers (accent to grey), and movement in the queue (green/red).
[theme]
base = "light"
primaryColor = "#E04E1B"
backgroundColor = "#FDFDFB"
secondaryBackgroundColor = "#F4F4F1"
textColor = "#1B1D20"
linkColor = "#C2410C"
borderColor = "#E4E4E7"
dataframeBorderColor = "#EDEDF0"
dataframeHeaderBackgroundColor = "#F4F4F1"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "full"
baseFontSize = 17
font = "Geist"
headingFont = "Geist"
codeFont = "Geist Mono"
headingFontSizes = ["44px", "32px", "22px", "20px", "18px", "16px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "44px"
metricValueFontWeight = 600
chartCategoricalColors = ["#E04E1B", "#52525B", "#A1A1AA"]
# Named colours for :green[...] and the badges: green/red = moved up/down,
# orange = the accent, gray = notes.
greenColor = "#15803D"
greenTextColor = "#166534"
greenBackgroundColor = "#E7F5EC"
redColor = "#B42318"
redTextColor = "#B42318"
redBackgroundColor = "#FBEAE9"
orangeColor = "#E04E1B"
orangeTextColor = "#C2410C"
orangeBackgroundColor = "#FCEEE7"
grayTextColor = "#52525B"
grayBackgroundColor = "#F0F0EC"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/Geist-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "Geist"
url = "app/static/Geist-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "Geist"
url = "app/static/Geist-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/GeistMono-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/GeistMono-500.woff2"
weight = 500
