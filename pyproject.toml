[project]
name = "icp-scout"
version = "0.1.0"
description = "Map a market from open data, research the shortlist with an agent, score it with a transparent rubric, and hand SDRs a ranked queue."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
icp-scout = "icp_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icp_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
