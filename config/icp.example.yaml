# An example ICP for a fictional vendor. The pipeline reads everything that is
# specific to a company from a file like this one; point ICP_SCOUT_CONFIG at
# your own copy to scout a different market.

vendor:
  name: Helio Desk
  pitch: >-
    Fictional all-in-one software for renewable installers: CRM, system
    planning and quoting in one place.

market:
  country: FR
  # ADEME RGE registry domains that qualify a company as a target.
  rge_domains:
    - "Pompe à chaleur : chauffage"
    - "Panneaux solaires photovoltaïques"
    - "Chauffage et/ou eau chaude solaire"
  # Product line -> the RGE domains that prove it (the product-mix pre-score).
  product_lines:
    heat_pump: ["Pompe à chaleur : chauffage"]
    solar: ["Panneaux solaires photovoltaïques", "Chauffage et/ou eau chaude solaire"]
  # Installers without RGE, from the company register: installer NAF codes,
  # at least 10 staff, and an energy word in the name (whole words only).
  second_source:
    naf_codes: ["43.21A", "43.22B"]
    name_keywords: ["solaire", "photovoltaïque", "énergie", "energie", "pac", "thermique"]
    min_headcount_band: "11"
  # Companies to add by SIREN whatever the filters say, e.g. a reference customer
  # that neither source finds. Optional.
  extra_sirens: []

segment:
  headcount_min: 30
  headcount_max: 300

# Companies known to fit well. The agent is shown them as calibration anchors.
reference_customers:
  - Soleil & Chaleur Installations (fictional)
  - Atelier Thermique du Nord (fictional)

# The rubric. The agent extracts each signal as a value in [0, 1] with its
# evidence; the score is 1 + 9 x the weighted mean. Weights are relative.
# `definition` says what 0, 0.5 and 1 mean; the agent extracts against it.
signals:
  - id: size_fit
    label: Headcount in the target band
    weight: 3
    definition: >-
      Headcount of the whole group (sister companies with the same manager,
      address or website count together). 1 = inside the segment band.
      0.5 = within half the band's width outside it, or no headcount but
      indirect evidence (branches, teams). 0 = far outside.
  - id: product_mix
    label: Installs both heat pumps and solar
    weight: 3
    definition: >-
      1 = installs solar PV and heat pumps. 0.5 = one of them plus an adjacent
      line (storage, EV chargers, heat-pump water heaters, solar thermal).
      0 = a single line.
  - id: growth
    label: Hiring for sales, planning or install roles, or opening sites
    weight: 2
    definition: >-
      1 = open roles in sales, planning, admin or installation, or a branch or
      entity opened in the last 24 months. 0.5 = one weak sign. 0 = no evidence.
  - id: tech_maturity
    label: Online configurator, lead forms, a CRM or a competing tool in use
    weight: 2
    definition: >-
      1 = a quote form that asks about the project (product, home, heating,
      roof or budget) or a simulator on its own website, or a named CRM or
      installer tool in use. 0.5 = own website with contact details or a plain
      contact form (name, email, message) only, whatever its title.
      0 = no own website.

# The rule-based pre-score (no LLM) picks this many groups for agent research.
prefilter:
  shortlist_size: 175

# The research agent. All keys are optional; these are the defaults.
research:
  # api: Messages API, billed per token. claude-code: the `claude` CLI on your
  # Claude subscription, no API money (log in with `claude` first).
  backend: api
  model: claude-opus-5-5   # recordings are per model: a new model means new calls
  effort: medium
  max_searches: 5          # web searches per lead ($10 per 1,000)
  max_fetches: 6           # pages fetched per lead
  # max_page_tokens: 6000  # cap each fetched page (pages are most of the input cost)
  budget_usd: 60           # stop starting new leads once a run has spent this
  concurrency: 4
  # claude-code only: stop starting leads once a usage window is this full.
  max_utilization: {five_hour: 0.9, seven_day: 0.7}

tiers:
  A: 8   # score >= 8
  B: 6   # score >= 6, otherwise C

outreach:
  language: fr
  # Translation shown next to each drafted opener, for reviewers who do not read French.
  translate_to: en
